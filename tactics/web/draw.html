<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pizarra táctica</title><link rel="stylesheet" href="/style.css"><body class="draw"><header><strong>Pizarra táctica</strong><span id="connection">Conectando…</span><span id="age">Sin referencia</span></header><nav><label>Trazo<select id="tool"><option value="free">Libre</option><option value="arrow">Flecha</option><option value="line">Línea</option><option value="circle">Círculo</option></select></label><label>Color<select id="color"><option value="#ffe04d">Amarillo</option><option value="#ff5050">Rojo</option><option value="#50d5ff">Azul</option><option value="#ffffff">Blanco</option><option value="#68ef99">Verde</option></select></label><label>Grosor<input id="width" type="range" min="1" max="12" value="3"></label><button id="undo">Deshacer</button><button id="clear">Borrar todo</button></nav><section id="viewport"><div id="surface"><img hidden id="reference" alt="Referencia de OBS"><canvas id="canvas"></canvas><span id="empty">Pulsa Actualizar imagen para comenzar.</span></div></section><footer><button id="capture">Actualizar imagen</button><button id="clear-capture">Borrar y actualizar</button><button id="follow" aria-pressed="false">Seguir cámara</button><label>Referencia<select id="resolution"><option value="640">640 px</option><option value="960">960 px</option></select></label><span id="message" role="status">Al reencuadrar, usa Borrar y actualizar.</span></footer><script src="/render.js"></script><script src="/app.js"></script></body></html>
