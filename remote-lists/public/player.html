<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar lista de ejército</title><link rel="stylesheet" href="/player.css"></head><body><main><p class="eyebrow">WARHAMMER 40,000</p><h1 id="title">Enviar lista</h1><p id="mode" hidden></p><p id="status" role="status">Comprobando si la subida está habilitada…</p><form id="import-form" hidden><label>Pega el texto exportado de tu app<textarea id="text" maxlength="6000" rows="12" required></textarea></label><p id="privacy">El texto se enviará a OpenAI para interpretar las unidades. Evita incluir datos personales. La revisión no valida las reglas del ejército.</p><button id="interpret">Interpretar lista</button></form><section id="preview" hidden><h2>Revisa antes de enviar</h2><label>Nombre de la lista<input id="name" maxlength="80"></label><p id="warnings" role="status"></p><p id="summary"></p><div id="units"></div><div class="preview-actions"><button type="button" id="add">Añadir unidad</button><button type="button" id="confirm">Confirmar y enviar</button><button type="button" id="back">Volver al texto</button></div></section></main><script src="/player.js"></script></body></html>
